# Manda el chequeo diario de la estrategia Saylor BTC por Telegram (precio,
# ROI estimado, recarga sugerida). Es de solo lectura sobre saylor_state.json
# — no cambia nada, por eso no necesita un paso de git commit/push. El estado
# solo cambia cuando Marcos confirma una recarga real (eso lo procesa el cron
# de alertas_btc.yml).
#
# El "schedule" de acá es solo un respaldo — GitHub puede demorar horas en
# disparar su cron nativo (visto en la práctica: corridas 3-5h tarde). El
# disparo confiable a las 8:00 Argentina es un cronjob externo en
# cron-job.org que pega directo a la API (workflow_dispatch), igual que se
# armó para alertas_btc.yml.

name: Chequeo diario Saylor BTC

on:
  schedule:
    - cron: "0 11 * * *"  # 11:00 UTC = 08:00 America/Buenos_Aires (respaldo, no confiable solo)
  workflow_dispatch: {}   # permite correrlo manualmente, y es lo que dispara cron-job.org

jobs:
  daily-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Mandar chequeo diario
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python saylor_bot.py --daily-check
